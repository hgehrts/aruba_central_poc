[aruba_central_index]
definition = index=main
description = Index (or indexes) that contain TA_hpe_aruba_central data. Set it on the app's Configuration page or in local/macros.conf, e.g. (index=network OR index=aruba).
iseval = 0

# ---------------------------------------------------------------------------
# Aruba syslog (optional). SC4S sends Aruba syslog as aruba:syslog; the add-on
# TA-aruba_networks renames it per process (aruba:authmgr, aruba:stm, ...) and
# shows events it could not rename as sourcetype "aruba".
# ---------------------------------------------------------------------------
[aruba_syslog_index]
definition = index=netops
description = Index (or indexes) that contain Aruba syslog. Set it on the app's Configuration page or in local/macros.conf, e.g. (index=netops OR index=wifi).
iseval = 0

[aruba_syslog]
definition = `aruba_syslog_index` (sourcetype="aruba:*" OR sourcetype="aruba") NOT sourcetype="aruba:central:*"
description = Aruba syslog events: the index macro aruba_syslog_index plus the sourcetype filter.
iseval = 0

# Adds fields that the dashboards use, from the raw event, so that the panels also
# work on search heads without TA-aruba_networks:
# aruba_process, aruba_event_id, aruba_level (CRIT, ERRS, WARN, NOTI, INFO, DBUG),
# aruba_severity (Error, Warning, Info), aruba_device, aruba_device_ip,
# aruba_ap (access point named in the message) and aruba_message.
[aruba_syslog_fields]
definition = rex "(?<aruba_process>[\w\-]+)\[\d+\]:\s+(?:<(?<aruba_event_id>\d+)>)?" | rex "<(?<aruba_level>CRIT|ERRS|WARN|NOTI|INFO|DBUG)>" | rex "(?:\|AP |[<(])(?<aruba_dvc_name>[^@<(\s|]+)[@\s](?<aruba_device_ip>\d{1,3}(?:\.\d{1,3}){3})[\s)>|]" | rex "<(?:CRIT|ERRS|WARN|NOTI|INFO|DBUG)>\s*(?:<[^>]*>\s*)*(?<aruba_message>.+)$" | rex "(?:AP \d{1,3}(?:\.\d{1,3}){3}-(?:[0-9a-fA-F]{2}[:-]){5}[0-9a-fA-F]{2}-|AP=|Detector-AP-Name:)(?<aruba_ap>[^\s;,]+)" | eval aruba_process=coalesce(aruba_process, if(match(_raw,"KERNEL\("),"kernel",null()), replace(sourcetype,"^aruba:","")), aruba_level=coalesce(aruba_level,"INFO"), aruba_severity=case(aruba_level="CRIT" OR aruba_level="ERRS","Error",aruba_level="WARN","Warning",true(),"Info"), aruba_device=coalesce(aruba_dvc_name,host), aruba_message=replace(coalesce(aruba_message,_raw),"^\|AP [^|]+\|\s*",""), aruba_ap=coalesce(aruba_ap,if(match(_raw,"\|AP "),aruba_device,null())) | fields - aruba_dvc_name
description = Adds aruba_process, aruba_event_id, aruba_level, aruba_severity, aruba_device, aruba_device_ip, aruba_ap and aruba_message to Aruba syslog events.
iseval = 0

# ---------------------------------------------------------------------------
# Firmware helpers. Version strings look like 10.8.1.1_96846 (access points)
# or LL.10.13.1140 (switches). The build suffix and the letter prefix are
# removed, then up to four numeric parts are turned into one sortable number.
# ---------------------------------------------------------------------------

# Turns a version string such as 10.8.1.2 into a sortable number.
# Usage: eval k=`aruba_ver_key(some_field)`
[aruba_ver_key(1)]
args = v
definition = tonumber(mvindex(split($v$,"."),0))*1000000000000+coalesce(tonumber(mvindex(split($v$,"."),1)),0)*100000000+coalesce(tonumber(mvindex(split($v$,"."),2)),0)*10000+coalesce(tonumber(mvindex(split($v$,"."),3)),0)
iseval = 0
description = Expression that converts a normalized version string (for example 10.8.1.2) into a sortable number.

# Adds fw_norm (version without build and prefix), fw_train (first two parts)
# and fw_key (sortable number) from the field firmwareVersion.
[aruba_fw_key]
definition = eval fw_norm=replace(replace(firmwareVersion,"_.*$",""),"^[A-Za-z]+\.","") | eval fw_train=mvindex(split(fw_norm,"."),0).".".mvindex(split(fw_norm,"."),1), fw_key=`aruba_ver_key(fw_norm)`
iseval = 0
description = Adds fw_norm, fw_train and fw_key from firmwareVersion.

# Compares fw_key with the baseline lookups (aruba_firmware_baseline_custom first,
# then aruba_firmware_baseline). Needs the
# field scope (for example "ap") and the fields added by `aruba_fw_key`.
# Adds min_fixed, advisory and fw_status.
[aruba_fw_baseline]
definition = lookup aruba_firmware_baseline_custom scope, train AS fw_train OUTPUT min_fixed advisory source_url AS advisory_url | lookup aruba_firmware_baseline scope, train AS fw_train OUTPUTNEW min_fixed advisory source_url AS advisory_url | eval fixed_key=`aruba_ver_key(min_fixed)` | eval fw_status=case(isnull(fw_key),"Unknown version",isnull(min_fixed),"Not in baseline",fw_key>=fixed_key,"At or above fixed version",true(),"Below fixed version")
iseval = 0
description = Adds min_fixed, advisory and fw_status by comparing the firmware with the baseline. Rows of the lookup aruba_firmware_baseline_custom (your own rows) win over the shipped lookup aruba_firmware_baseline.

# Keeps the access points whose model and version fall into a documented issue
# range of the lookups aruba_known_issues and aruba_known_issues_custom. One row per access point and issue.
# Needs the field model and the fields added by `aruba_fw_key`.
[aruba_fw_issues]
definition = eval _k=1 | join type=inner max=0 _k [| inputlookup aruba_known_issues | append [| inputlookup aruba_known_issues_custom] | eval _k=1, ki_from_key=`aruba_ver_key(fw_from)`, ki_fixed_key=if(len(fixed_in)>0,`aruba_ver_key(fixed_in)`,9000000000000000) | rename model_prefix AS ki_prefix, bug_id AS ki_bug, issue AS ki_issue, fixed_in AS ki_fixed, source_url AS ki_url | fields _k ki_*] | where like(model, ki_prefix."%") AND fw_key>=ki_from_key AND fw_key<ki_fixed_key | fields - _k
iseval = 0
description = Keeps access points whose model and firmware are inside a documented issue range of the lookups aruba_known_issues (shipped) and aruba_known_issues_custom (your own rows).

# Converts an ISO 8601 UTC timestamp such as 2026-11-25T11:11:08.804Z to epoch.
# Usage: eval created=`aruba_iso_epoch(createdAt)`
[aruba_iso_epoch(1)]
args = t
definition = strptime(replace($t$,"\.\d+Z$","+0000"),"%Y-%m-%dT%H:%M:%S%z")
iseval = 0
description = Expression that converts an ISO 8601 UTC timestamp to epoch seconds.
