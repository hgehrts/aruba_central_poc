[aruba_firmware_baseline]
filename = aruba_firmware_baseline.csv
case_sensitive_match = false

[aruba_known_issues]
filename = aruba_known_issues.csv
case_sensitive_match = false

# Your own rows. They live in the KV Store, so an app upgrade never overwrites them.
# Same columns as the CSV lookups above. Edit them in the Lookup Editor app.
[aruba_firmware_baseline_custom]
external_type = kvstore
collection = aruba_firmware_baseline_custom
fields_list = _key, scope, train, min_fixed, advisory, source_url, note
case_sensitive_match = false

[aruba_known_issues_custom]
external_type = kvstore
collection = aruba_known_issues_custom
fields_list = _key, model_prefix, fw_from, fixed_in, bug_id, issue, source_url
case_sensitive_match = false
