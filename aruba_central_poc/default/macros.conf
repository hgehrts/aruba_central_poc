[aruba_central_index]
definition = index=main
description = Index (or indexes) that contain TA_hpe_aruba_central data. Set it on the app's Configuration page or in local/macros.conf, e.g. (index=network OR index=aruba).
iseval = 0

# ---------------------------------------------------------------------------
# Firmware helpers. Version strings look like 10.8.1.1_96846 (access points)
# or LL.10.13.1140 (switches). The build suffix and the letter prefix are
# removed, then up to four numeric parts are turned into one sortable number.
# ---------------------------------------------------------------------------

# Turns a version string such as 10.8.1.2 into a sortable number.
# Usage: eval k=`aruba_ver_key(some_field)`
[aruba_ver_key(1)]
args = v
definition = tonumber(mvindex(split($v$,"."),0))*1000000000000+coalesce(tonumber(mvindex(split($v$,"."),1)),0)*100000000+coalesce(tonumber(mvindex(split($v$,"."),2)),0)*10000+coalesce(tonumber(mvindex(split($v$,"."),3)),0)
iseval = 0
description = Expression that converts a normalized version string (for example 10.8.1.2) into a sortable number.

# Adds fw_norm (version without build and prefix), fw_train (first two parts)
# and fw_key (sortable number) from the field firmwareVersion.
[aruba_fw_key]
definition = eval fw_norm=replace(replace(firmwareVersion,"_.*$",""),"^[A-Za-z]+\.","") | eval fw_train=mvindex(split(fw_norm,"."),0).".".mvindex(split(fw_norm,"."),1), fw_key=`aruba_ver_key(fw_norm)`
iseval = 0
description = Adds fw_norm, fw_train and fw_key from firmwareVersion.

# Compares fw_key with the baseline lookup (aruba_firmware_baseline). Needs the
# field scope (for example "ap") and the fields added by `aruba_fw_key`.
# Adds min_fixed, advisory and fw_status.
[aruba_fw_baseline]
definition = lookup aruba_firmware_baseline scope, train AS fw_train OUTPUT min_fixed advisory source_url AS advisory_url | eval fixed_key=`aruba_ver_key(min_fixed)` | eval fw_status=case(isnull(fw_key),"Unknown version",isnull(min_fixed),"Not in baseline",fw_key>=fixed_key,"At or above fixed version",true(),"Below fixed version")
iseval = 0
description = Adds min_fixed, advisory and fw_status by comparing the firmware with the lookup aruba_firmware_baseline.

# Keeps the access points whose model and version fall into a documented issue
# range of the lookup aruba_known_issues. One row per access point and issue.
# Needs the field model and the fields added by `aruba_fw_key`.
[aruba_fw_issues]
definition = eval _k=1 | join type=inner max=0 _k [| inputlookup aruba_known_issues | eval _k=1, ki_from_key=`aruba_ver_key(fw_from)`, ki_fixed_key=if(len(fixed_in)>0,`aruba_ver_key(fixed_in)`,9000000000000000) | rename model_prefix AS ki_prefix, bug_id AS ki_bug, issue AS ki_issue, fixed_in AS ki_fixed, source_url AS ki_url | fields _k ki_*] | where like(model, ki_prefix."%") AND fw_key>=ki_from_key AND fw_key<ki_fixed_key | fields - _k
iseval = 0
description = Keeps access points whose model and firmware are inside a documented issue range of the lookup aruba_known_issues.

# Converts an ISO 8601 UTC timestamp such as 2026-11-25T11:11:08.804Z to epoch.
# Usage: eval created=`aruba_iso_epoch(createdAt)`
[aruba_iso_epoch(1)]
args = t
definition = strptime(replace($t$,"\.\d+Z$","+0000"),"%Y-%m-%dT%H:%M:%S%z")
iseval = 0
description = Expression that converts an ISO 8601 UTC timestamp to epoch seconds.
